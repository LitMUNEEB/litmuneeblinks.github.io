<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LIT_MUNEEB — find me</title>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@1,900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#080808;--ink:#e9e6e1;--red:#ff343d;--dim:#85837e;--line:#2e2d2a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"],:root[data-theme="dark"]{--bg:#080808}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(ellipse at 50% 0%,#3a0f12 0,transparent 55%),var(--bg);color:var(--ink);font-family:'JetBrains Mono',ui-monospace,monospace;font-size:13px;min-height:100vh;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;opacity:.14;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
body:after{content:"";position:fixed;inset:0;pointer-events:none;z-index:49;background:repeating-linear-gradient(0deg,transparent 0 2px,#00000030 3px)}
.wrap{max-width:560px;margin:0 auto;padding:34px 20px 60px;position:relative}
.warn{font-size:10px;letter-spacing:.1em;color:var(--dim);display:flex;justify-content:space-between;gap:10px;margin-bottom:46px}
.warn b{color:var(--red);font-weight:400}
h1{font-family:'Bodoni Moda',Georgia,serif;font-style:italic;font-weight:900;font-size:clamp(54px,16vw,92px);line-height:.84;margin:0;letter-spacing:-.03em;color:#dcd9d3}
h1 span{color:var(--red)}
h1.g{animation:gl .35s steps(2) 1}
@keyframes gl{0%{text-shadow:-5px 0 var(--red),5px 0 #2cf}25%{transform:translate(6px,-2px);clip-path:inset(30% 0 30% 0)}50%{transform:translate(-6px,2px);clip-path:inset(0 0 60% 0)}75%{transform:translate(3px,0);clip-path:inset(55% 0 0 0)}100%{transform:none;clip-path:none}}
.sub{margin:18px 0 6px;letter-spacing:.07em;color:#b4b0a7;font-size:11px}
.jp{color:var(--red);font-size:12px;margin-bottom:34px}
.status{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);padding:6px 12px;font-size:10px;letter-spacing:.08em;margin-bottom:26px}
.status i{width:6px;height:6px;border-radius:50%;background:var(--red);box-shadow:0 0 12px var(--red);animation:b 1.4s infinite}
@keyframes b{50%{opacity:.2}}
.lbl{font-size:10px;color:var(--red);letter-spacing:.14em;margin:34px 0 12px}
.card{display:flex;align-items:center;gap:14px;width:100%;text-align:left;font:inherit;color:var(--ink);background:#0d0d0def;border:1px solid #aaa69e55;padding:15px 16px;margin-bottom:10px;text-decoration:none;cursor:pointer;position:relative;transition:transform .15s,border-color .15s,box-shadow .15s}
.card:hover{transform:translate(-3px,-3px);border-color:var(--red);box-shadow:5px 5px 0 var(--red)}
.ic{flex:none;width:40px;height:40px;display:grid;place-items:center;border:1px solid #aaa69e55;font-weight:700;font-size:13px;color:var(--red);background:#141414}
.tx{flex:1;min-width:0}
.tx b{display:block;font-size:14px;letter-spacing:.04em}
.tx small{display:block;color:var(--dim);font-size:11px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.go{color:var(--red);font-size:16px}
.big{background:var(--red);border-color:#000;color:#090909;padding:22px 18px;box-shadow:6px 6px 0 #fff2}
.big .ic{background:#090909;border-color:#090909;color:var(--red);width:52px;height:52px;font-size:15px}
.big .tx b{font-size:20px}
.big .tx small{color:#2b0507}
.big .go{color:#090909}
.big:hover{border-color:#000;box-shadow:8px 8px 0 #fff}
.tag{position:absolute;top:-10px;right:12px;background:#090909;color:var(--red);font-size:9px;letter-spacing:.1em;padding:3px 8px;border:1px solid var(--red)}
.foot{margin-top:50px;text-align:center;color:var(--dim);font-size:10px;letter-spacing:.08em;line-height:1.9}
.foot b{color:var(--red);font-weight:400}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--red);color:#090909;padding:9px 16px;font-size:12px;z-index:100;opacity:0;transition:.2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="wrap">
<div class="warn"><span><b>▲</b> NO RULES HERE</span><span>LINKS.EXE</span></div>
<h1 id="h">LIT<span>_</span><br>MUNEEB</h1>
<p class="sub">TEXTURE ARTIST / ANIMATOR / DESIGNER</p>
<div class="jp">リット・ムニーブ // find me anywhere</div>
<div class="status"><i></i>MOST ACTIVE ON DISCORD</div>

<div id="main"></div>
<div class="lbl">// SOCIALS</div>
<div id="soc"></div>
<div class="lbl">// WORK &amp; ARCHIVE</div>
<div id="work"></div>

<div class="foot">LIT_MUNEEB © 2026<br>tap a card. <b>discord</b> is the fastest way.</div>
</div>
<div class="toast" id="t"></div>

<script>
/* ====== EDIT HERE ======
   Har item ke 3 kaam: name, handle (jo dikhana hai), url (link).
   copy:true  => card par click karne se handle copy ho jata hai (WeChat/Discord ID ke liye).
   Jab tak url mein "YOUR" likha hai, card par click karne se "link abhi add nahi hua" aayega.
*/
const MAIN = { ic:"DC", name:"DISCORD", handle:"Discord profile", url:"https://discord.com/users/1166361272716103812", copy:false, note:"MOST ACTIVE", desc:"Open my profile and DM me. Fastest reply." };

const SOCIALS = [
 { ic:"IG", name:"INSTAGRAM",   handle:"@lil_muneeb",  url:"https://www.instagram.com/lil_muneeb" },
 { ic:"FB", name:"FACEBOOK",    handle:"Facebook profile", url:"https://www.facebook.com/profile.php?id=61590494442829" },
 { ic:"X",  name:"X / TWITTER", handle:"@lit__muneeb", url:"https://x.com/lit__muneeb" }
];

const WORK = [
 { ic:"PF", name:"TEXTURE PACKS PORTFOLIO", handle:"My Minecraft texture portfolio", url:"https://litmuneebpacks.github.io" },
 { ic:"CF", name:"CURSEFORGE", handle:"Texture packs · 4K+ downloads", url:"https://www.curseforge.com/members/lit_muneeb" },
 { ic:"MR", name:"MODRINTH",   handle:"Texture packs", url:"https://modrinth.com/user/lit_muneeb" },
 { ic:"YT", name:"YOUTUBE",    handle:"@Lit_MUNEEB · 950+ subs (archive)", url:"https://www.youtube.com/@Lit_MUNEEB" },
 { ic:"RB", name:"RODEVS",     handle:"Roblox animation portfolio", url:"https://rodevs.com/portfolios/1166361272716103812" }
];
/* ====== END EDIT ====== */

const $=s=>document.querySelector(s);
function toast(m){const t=$('#t');t.textContent=m;t.classList.add('on');clearTimeout(toast.i);toast.i=setTimeout(()=>t.classList.remove('on'),1900)}
function copy(txt){
  const ok=()=>toast('Copied: '+txt);
  try{navigator.clipboard.writeText(txt).then(ok,()=>fallback())}catch(e){fallback()}
  function fallback(){const a=document.createElement('textarea');a.value=txt;document.body.appendChild(a);a.select();try{document.execCommand('copy');ok()}catch(e){toast('Copy nahi hua: '+txt)}a.remove()}
}
function card(o,big){
  const e=document.createElement(o.copy||!o.url?'button':'a');
  e.className='card'+(big?' big':'');
  if(!o.copy&&o.url){e.href=o.url;e.target='_blank';e.rel='noopener noreferrer'}
  e.innerHTML=(o.note?'<span class="tag">'+o.note+'</span>':'')+'<span class="ic">'+o.ic+'</span><span class="tx"><b>'+o.name+'</b><small>'+(big&&o.desc?o.desc:o.handle)+'</small></span><span class="go">'+(o.copy?'COPY':'↗')+'</span>';
  if(o.copy)e.onclick=()=>copy(o.handle);
  else if(/YOUR/.test(o.url)){e.onclick=ev=>{ev.preventDefault();toast('Link abhi add nahi hua.')}}
  return e;
}
$('#main').appendChild(card(MAIN,true));
SOCIALS.forEach(o=>$('#soc').appendChild(card(o)));
WORK.forEach(o=>$('#work').appendChild(card(o)));
const h=$('#h');h.onanimationend=()=>h.classList.remove('g');h.onclick=()=>h.classList.add('g');setInterval(()=>h.classList.add('g'),8000);
</script>
</body>
</html>
